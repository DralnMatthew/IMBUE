[project]
name = "imbue"
version = "0.1.0"
description = "Amortized Bayesian Experimental Design with In-Context Knowledge Conditioning"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "torch>=2.2,<2.11",
  "numpy>=1.26",
  "termcolor>=2.0",
  "wandb>=0.16",
  "hydra-core>=1.3",
  "pandas>=2.1",
  "attrdictionary>=1.0",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "ipykernel>=6.29",
  "scikit-learn>=1.6",
  "scipy>=1.11",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning",
]
